name: build-test
description: Verify that the container image builds for a pull request.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: runnerlib run --job-command "bash /job/ci/.reactorcide/jobs/scripts/build-test.sh"
  timeout: 900
  capabilities:
    - builder
  run_local:
    user: host
