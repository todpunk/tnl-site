name: pr-merge-workflow
description: Update the site version after a pull request merges.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: runnerlib run --job-command "python3 /job/ci/.reactorcide/jobs/scripts/pr-merge-workflow.py"
  timeout: 1800
environment:
  GIT_USER_NAME: "Tod Hansmann (automation)"
  GIT_USER_EMAIL: "githubpub@todandlorna.com"
  GITHUB_TOKEN: "${secret:tnl-site/github:token}"
